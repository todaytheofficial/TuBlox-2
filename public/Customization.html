<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuBlox - Customization</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .customizer-container {
            display: flex;
            max-width: 1200px;
            margin: 50px auto;
            background: #2e3440;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            color: #eceff4;
        }
        .preview-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #3b4252;
            border-radius: 8px;
            margin-right: 20px;
        }
        .controls-area {
            flex: 2;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .control-group {
            background: #4c566a;
            padding: 15px;
            border-radius: 8px;
        }
        .control-group h3 {
            margin-top: 0;
            border-bottom: 1px solid #5e81ac;
            padding-bottom: 5px;
            color: #88c0d0;
        }
        input[type="color"] {
            width: 100%;
            height: 30px;
            border: none;
            border-radius: 4px;
        }
        select, button.save-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
        }
        button.save-btn {
            background: #a3be8c;
            color: #2e3440;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button.save-btn:hover {
            background: #8fbcbb;
        }
        /* Стили для предпросмотра на канвасе */
        #previewCanvas {
            border: 2px solid #5e81ac;
            background: #2e3440; /* Темный фон для контраста */
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="dashboard.html" style="text-decoration:none; color:inherit;">
                <img src="avatar.png" class="logo" alt="TuBlox 2">
                <h1>TuBlox 2</h1>
            </a>
        </div>
        <div class="header-right">
             <button onclick="window.location.href='dashboard.html'" class="studio-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l-7-7 7-7m7 14l-7-7 7-7"/></svg>
                Dashboard
            </button>
        </div>
    </header>

    <div class="customizer-container">
        <div class="preview-area">
            <h3>Character Preview</h3>
            <canvas id="previewCanvas" width="150" height="250"></canvas>
            <p id="save-status" style="margin-top: 15px; color: #a3be8c;"></p>
        </div>
        
        <div class="controls-area">
            
            <div class="control-group">
                <h3>Skin & Body</h3>
                <label for="skin-color">Skin Color:</label>
                <input type="color" id="skin-color" value="#ffccaa">
            </div>

            <div class="control-group">
                <h3>Torso</h3>
                <label for="torso-color">Shirt Color:</label>
                <input type="color" id="torso-color" value="#81a1c1">
            </div>

            <div class="control-group">
                <h3>Legs</h3>
                <label for="legs-color">Pants Color:</label>
                <input type="color" id="legs-color" value="#1a1a1a">
            </div>

            <div class="control-group">
                <h3>Hair & Hat</h3>
                <label for="hair-style">Hair Style:</label>
                <select id="hair-style">
                    <option value="none">None</option>
                    <option value="short" selected>Short</option>
                    <option value="long">Long</option>
                    <option value="messy">Messy</option>
                </select>
                <label for="hair-color">Hair Color:</label>
                <input type="color" id="hair-color" value="#4c566a">
            </div>
            
            <div class="control-group">
                <h3>Accessories</h3>
                <label for="hat-style">Hat:</label>
                <select id="hat-style">
                    <option value="none" selected>None</option>
                    <option value="cap">Cap</option>
                    <option value="beanie">Beanie</option>
                </select>
            </div>

            <div style="grid-column: 1 / -1;">
                <button class="save-btn" onclick="saveCustomization()">Save Character</button>
            </div>
        </div>
    </div>

    <script src="auth.js"></script> 
    <script>
        // --- ДАННЫЕ КАСТОМИЗАЦИИ (по умолчанию) ---
        let customization = {
            skinColor: '#ffccaa',
            torsoColor: '#81a1c1',
            legsColor: '#1a1a1a',
            hairStyle: 'short',
            hairColor: '#4c566a',
            hatStyle: 'none',
        };

        const canvas = document.getElementById('previewCanvas');
        const ctx = canvas.getContext('2d');
        const playerHeight = 60;
        const playerWidth = 30;
        const scale = 2; // Масштабируем для лучшего предпросмотра
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;


        // --- ЗАГРУЗКА ИЗ LOCAL STORAGE ---
        function loadCustomization() {
            const savedData = localStorage.getItem('tublox_customization');
            if (savedData) {
                customization = JSON.parse(savedData);
            }
            // Устанавливаем значения в контролы
            document.getElementById('skin-color').value = customization.skinColor;
            document.getElementById('torso-color').value = customization.torsoColor;
            document.getElementById('legs-color').value = customization.legsColor;
            document.getElementById('hair-style').value = customization.hairStyle;
            document.getElementById('hair-color').value = customization.hairColor;
            document.getElementById('hat-style').value = customization.hatStyle;
        }

        // --- ФУНКЦИЯ ОТРИСОВКИ ПЕРСОНАЖА (Адаптация из game.js) ---
        function drawPreview() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const p = {
                x: centerX - playerWidth / 2 * scale, 
                y: centerY - playerHeight / 2 * scale,
                w: playerWidth * scale,
                h: playerHeight * scale,
                ...customization
            };

            const bodyOffY = 0; // В предпросмотре не двигаем
            
            // --- НОГИ ---
            ctx.fillStyle = p.legsColor; // Используем цвет штанов
            ctx.fillRect(p.x, p.y + p.h * 0.75, p.w * 0.45, p.h * 0.25);
            ctx.fillRect(p.x + p.w * 0.55, p.y + p.h * 0.75, p.w * 0.45, p.h * 0.25);

            // --- ТЕЛО (Торс) ---
            ctx.fillStyle = p.torsoColor; // Используем цвет футболки
            ctx.fillRect(p.x, p.y + p.h * 0.25 + bodyOffY, p.w, p.h * 0.5);

            // --- РУКИ (Используем Skin Color) ---
            ctx.fillStyle = p.skinColor; 
            ctx.fillRect(p.x - p.w * 0.2, p.y + p.h * 0.3 + bodyOffY, p.w * 0.2, p.h * 0.3); // Левая рука
            ctx.fillRect(p.x + p.w, p.y + p.h * 0.3 + bodyOffY, p.w * 0.2, p.h * 0.3); // Правая рука

            // --- ГОЛОВА ---
            ctx.fillStyle = p.skinColor; 
            ctx.fillRect(p.x + p.w * 0.1, p.y + bodyOffY - p.h * 0.15, p.w * 0.8, p.h * 0.3);
            
            // --- ГЛАЗА (для предпросмотра) ---
            ctx.fillStyle = "black";
            ctx.fillRect(p.x + p.w * 0.3, p.y + bodyOffY, p.w * 0.1, p.h * 0.05);
            ctx.fillRect(p.x + p.w * 0.5, p.y + bodyOffY, p.w * 0.1, p.h * 0.05);

            // --- ПРИЧЕСКА ---
            if (p.hairStyle !== 'none') {
                ctx.fillStyle = p.hairColor;
                // Простая отрисовка причесок
                if (p.hairStyle === 'short') {
                    ctx.fillRect(p.x + p.w * 0.1, p.y + bodyOffY - p.h * 0.2, p.w * 0.8, p.h * 0.1);
                    ctx.fillRect(p.x, p.y + bodyOffY - p.h * 0.15, p.w * 0.1, p.h * 0.1);
                    ctx.fillRect(p.x + p.w * 0.9, p.y + bodyOffY - p.h * 0.15, p.w * 0.1, p.h * 0.1);
                } else if (p.hairStyle === 'long') {
                    ctx.fillRect(p.x, p.y + bodyOffY - p.h * 0.2, p.w, p.h * 0.1);
                    ctx.fillRect(p.x - p.w * 0.2, p.y + bodyOffY - p.h * 0.1, p.w * 0.2, p.h * 0.5); 
                }
            }

            // --- ШАПКА ---
            if (p.hatStyle !== 'none') {
                ctx.fillStyle = '#bf616a'; // Цвет шапки
                if (p.hatStyle === 'cap') {
                    ctx.fillRect(p.x, p.y + bodyOffY - p.h * 0.3, p.w, p.h * 0.15); // Основная часть
                    ctx.fillRect(p.x + p.w * 0.6, p.y + bodyOffY - p.h * 0.2, p.w * 0.4, p.h * 0.05); // Козырек
                } else if (p.hatStyle === 'beanie') {
                    ctx.beginPath();
                    ctx.arc(centerX, p.y + bodyOffY - p.h * 0.25, p.w * 0.6, 0, Math.PI, true);
                    ctx.fill();
                }
            }
        }

        // --- СОХРАНЕНИЕ И ОБРАБОТКА ИЗМЕНЕНИЙ ---
        function updateCustomization() {
            customization.skinColor = document.getElementById('skin-color').value;
            customization.torsoColor = document.getElementById('torso-color').value;
            customization.legsColor = document.getElementById('legs-color').value;
            customization.hairStyle = document.getElementById('hair-style').value;
            customization.hairColor = document.getElementById('hair-color').value;
            customization.hatStyle = document.getElementById('hat-style').value;
            drawPreview();
        }

        function saveCustomization() {
            updateCustomization(); // Обновляем данные перед сохранением
            localStorage.setItem('tublox_customization', JSON.stringify(customization));
            
            const status = document.getElementById('save-status');
            status.innerText = 'Saved!';
            setTimeout(() => status.innerText = '', 2000);
        }

        // Привязываем события к элементам управления
        document.querySelectorAll('.controls-area input, .controls-area select').forEach(control => {
            control.addEventListener('input', updateCustomization);
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthAndRedirect(false); // Предполагая, что auth.js содержит эту функцию
            loadCustomization();
            drawPreview();
        });
    </script>
</body>
</html>
