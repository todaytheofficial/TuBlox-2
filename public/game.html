<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuBlox 2 - Игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">
    <div id="game-container">
        <button id="exit-game-btn" class="exit-btn">← Выйти</button>
        
        <canvas id="gameCanvas"></canvas>

        <div id="chat-box"> 
            <div id="chat-messages"></div>
            <input type="text" id="chat-input" placeholder="Чат...">
        </div>

        <div id="mobile-controls">
            <div id="btn-jump" class="control-btn">↑</div>
            <div id="btn-left" class="control-btn">←</div>
            <div id="btn-right" class="control-btn">→</div>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="auth.js"></script> 
    <script src="game.js"></script>
</body>
</html>
